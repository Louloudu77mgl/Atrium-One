name: Automatisations planifiees AtriumOne

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: google-reviews-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synchroniser les avis et exécuter les scénarios
        env:
          CRON_SECRET: ${{ secrets.ATRIUM_CRON_SECRET }}
          CRON_URL: https://atrium-one-self.vercel.app/api/cron/google-reviews
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL"

  publish-instagram:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publier les posts Instagram planifies
        env:
          CRON_SECRET: ${{ secrets.ATRIUM_CRON_SECRET }}
          CRON_URL: https://atrium-one-self.vercel.app/api/cron/social-publish
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL"
